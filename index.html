<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loro</title>
<meta name="theme-color" content="#FFF1D6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#FFF1D6;--card:#FFFDF8;--rule:#EBDDF5;--margin:#0A9AAB;
  --ink:#1B1030;--ink-2:#5C4B73;--ink-3:#85769B;--line:#E3D3B6;--chip:#F6E3BC;--seg-on:#FFFFFF;
  --accent:#D4146F;--accent-deep:#1B1030;--accent-soft:#FFE0EE;--on-accent:#FFFFFF;
  --flame:#FF8A00;--bubble:#FFFFFF;--lime:#B7F34D;
  --easy:#11874F;--medium:#3A55D6;--hard:#B35A00;--wrong:#D1193A;
  --shadow:0 1px 0 rgba(27,16,48,.08),0 14px 30px -18px rgba(27,16,48,.55);
  --shadow-sm:0 1px 2px rgba(27,16,48,.16);
  --backdrop:rgba(20,8,34,.5);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#140A22;--card:#22123A;--rule:#35205A;--margin:#3DD6E0;
    --ink:#F6EEFF;--ink-2:#BFAFD8;--ink-3:#8E7EAA;--line:#44306A;--chip:#2D1A4A;--seg-on:#43285F;
    --accent:#FF6FB1;--accent-deep:#0B0416;--accent-soft:#3D1B3E;--on-accent:#1B0A22;--flame:#FFB020;--bubble:#2D1A44;--lime:#B7F34D;
    --easy:#4BE08F;--medium:#93A8FF;--hard:#FFB454;--wrong:#FF7A8C;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 30px -18px rgba(0,0,0,.8);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --backdrop:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#140A22;--card:#22123A;--rule:#35205A;--margin:#3DD6E0;
  --ink:#F6EEFF;--ink-2:#BFAFD8;--ink-3:#8E7EAA;--line:#44306A;--chip:#2D1A4A;--seg-on:#43285F;
  --accent:#FF6FB1;--accent-deep:#0B0416;--accent-soft:#3D1B3E;--on-accent:#1B0A22;--flame:#FFB020;--bubble:#2D1A44;--lime:#B7F34D;
  --easy:#4BE08F;--medium:#93A8FF;--hard:#FFB454;--wrong:#FF7A8C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 30px -18px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 17px/1.5 var(--text);min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(92px + env(safe-area-inset-bottom,0px))}
body.focus #app{padding-bottom:28px}
body.focus nav{display:none}

.title{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:6px 0 18px}
.sub{color:var(--ink-2);margin:-10px 0 18px}
h3{font:700 15px/1.3 var(--text);color:var(--ink-2);margin:22px 0 10px}

/* the index card */
.index{background:var(--card);border-radius:6px;box-shadow:var(--shadow);position:relative;border-top:6px solid var(--accent)}
.index .head{padding:20px 22px 14px;border-bottom:2px solid var(--margin)}
.index .body{padding:6px 22px 18px;line-height:32px;min-height:136px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 6px}
.index .body p{margin:0}
.stack{position:relative;isolation:isolate;margin:4px 4px 8px}
.stack::before,.stack::after{content:"";position:absolute;inset:0;background:var(--card);border-radius:6px;box-shadow:var(--shadow);z-index:-1}
.stack::before{transform:rotate(-2.2deg) translate(-4px,8px);opacity:.55}
.stack::after{transform:rotate(1.6deg) translate(5px,4px);opacity:.8}
.kicker{font:700 14px/1.3 var(--text);color:var(--margin);margin:0 0 4px}
.prompt{font:700 clamp(30px,9vw,44px)/1.08 var(--display);letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.note{color:var(--ink-2);margin:6px 0 0;font-size:16px;line-height:1.35}
.answer{font:700 clamp(30px,9vw,42px)/64px var(--display);color:var(--accent);letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.answer mark{background:none;color:var(--margin);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.speak{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.speak svg{width:20px;height:20px}
.verdict{font-weight:700}
.v-good{color:var(--easy)}.v-close{color:var(--hard)}.v-bad{color:var(--wrong)}
.wrote{color:var(--ink-2)}
.answer-in{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* controls */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.custom-size{display:flex;align-items:center;gap:8px;margin-top:10px}
.custom-size input{width:96px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-weight:700}
.btn-primary{display:block;width:100%;min-height:56px;border:2.5px solid var(--accent-deep);border-radius:16px;background:var(--accent);color:var(--on-accent);font:800 19px var(--display);letter-spacing:.01em;margin-top:24px;box-shadow:0 5px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.btn-danger{color:var(--wrong)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn-row .btn{flex:1 1 auto}
.linkish{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;min-height:44px}

/* review */
.rv-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn svg{width:20px;height:20px}
.progress{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .3s ease}
.left{font-weight:700;color:var(--ink-2);font-size:15px;white-space:nowrap}
.undo{background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0 4px}
.undo:disabled{color:var(--ink-3);cursor:default}
.tag{display:inline-block;font:700 14px/1.3 var(--text);color:var(--margin);margin-bottom:4px}
.controls{margin-top:18px}
.answer-input{width:100%;font:700 26px var(--display);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.answer-input:focus{border-color:var(--accent);outline:none}
.keys{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.key{min-width:42px;min-height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font:700 18px var(--display)}
.type-row{display:flex;gap:10px;margin-top:12px}
.type-row .btn{flex:1}
.type-row .btn-primary{margin:0;flex:2;min-height:50px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{--c:var(--ink);min-height:72px;border:0;border-radius:14px;background:var(--card);color:var(--c);box-shadow:inset 0 3px 0 var(--c),var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;font:700 17px/1.1 var(--display)}
.rate small{font:400 12px/1.2 var(--text);color:var(--ink-2);margin-top:4px;text-align:center}
.rate.easy{--c:var(--easy)}.rate.medium{--c:var(--medium)}.rate.hard{--c:var(--hard)}.rate.wrong{--c:var(--wrong)}
.rate.suggested{outline:2.5px solid var(--c);outline-offset:2px}
.hint{color:var(--ink-3);font-size:14px;text-align:center;margin-top:12px}

/* summary */
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0 8px}
.bar span{display:block}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:14px;color:var(--ink-2);line-height:1.3}
.legend b{display:block;font:700 22px var(--display)}
.missed{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.missed .es{color:var(--accent);font-weight:700}

/* words */
.search{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;margin:14px 0}
.list{background:var(--card);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none}
.row:last-child{border-bottom:0}
.row .en{font-weight:700}
.row .es{color:var(--accent)}
.row .st{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:13px;color:var(--ink-3);white-space:nowrap}
.row .st.due{color:var(--margin);font-weight:700}
.empty{padding:22px 16px;color:var(--ink-2)}
.more{padding:12px 16px;color:var(--ink-3);font-size:14px}

/* forms & sheet */
label.f{display:block;font-weight:700;margin:16px 0 6px}
.field{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px}
textarea.field{min-height:140px;resize:vertical;font-size:15px;line-height:1.4}
.help{color:var(--ink-2);font-size:15px;margin:6px 0 0}
.sheet-wrap{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--desk);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:rise .2s ease-out}
.sheet h2{font:800 26px var(--display);margin:0 0 4px}
.check{display:flex;gap:12px;align-items:flex-start;margin:14px 0;font-weight:700}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.check span small{display:block;font-weight:400;color:var(--ink-2);font-size:15px}
.preview{width:100%;border-collapse:collapse;font-size:15px}
.preview th{text-align:left;color:var(--ink-2);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line)}
.preview td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.preview td:nth-child(2){color:var(--accent);font-weight:700}
.scroll-x{overflow-x:auto}
.panel{background:var(--card);border-radius:6px;box-shadow:var(--shadow);padding:18px}
.panel+.panel{margin-top:14px}
.panel h2{font:700 20px var(--display);margin:0 0 6px}
.stepper{display:flex;align-items:center;gap:12px;margin-top:8px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:700 22px var(--display)}
.stepper output{font:800 26px var(--display);min-width:40px;text-align:center}
dl.rules{margin:8px 0 0}
dl.rules dt{font:700 17px var(--display);margin-top:12px}
dl.rules dd{margin:2px 0 0;color:var(--ink-2)}
.dt-easy{color:var(--easy)}.dt-medium{color:var(--medium)}.dt-hard{color:var(--hard)}.dt-wrong{color:var(--wrong)}
.status{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--easy)}.dot.busy{background:var(--hard)}.dot.bad{background:var(--wrong)}

/* nav & toast */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav-in{display:flex;max-width:560px;margin:0 auto}
.nav-in button{flex:1;min-height:62px;background:none;border:0;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 13px var(--text)}
.nav-in svg{width:24px;height:24px}
.nav-in button[aria-current="page"]{color:var(--accent)}
/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px}
.tile b{display:block;font:800 26px/1.1 var(--display);letter-spacing:-.01em}
.tile span{display:block;color:var(--ink-2);font-size:14px;margin-top:4px}
.mixrow+.mixrow{margin-top:18px}
.mixhead{display:flex;justify-content:space-between;font-size:15px}
.mixhead span{color:var(--ink-3)}
.mixrow .bar{margin:8px 0 6px}
.mixleg{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.mixleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.wk{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:10px;margin:10px 0;font-size:15px;color:var(--ink-2)}
.wk small{display:block;color:var(--ink-3);font-size:12px;line-height:1.2}
.wk .track{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.wk .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.wk b{text-align:right;color:var(--ink)}
.panel .row{padding:10px 0}
.panel div.row{cursor:default}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .icon-btn{width:38px;height:38px;box-shadow:none;background:var(--chip)}
.cal-head .icon-btn:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-w{font-size:12px;color:var(--ink-3);font-weight:700}
.cal-d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:14px;color:var(--ink-2)}
.cal-d.did{background:var(--accent);color:var(--on-accent);font-weight:800}
.cal-d.today{outline:2px solid var(--flame);outline-offset:1px}
.deck-seg{margin-top:16px}
.vrow{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center;margin:6px 0}
.vrow label{font-size:14px;color:var(--ink-2);font-weight:700;line-height:1.2}
.vrow .field{min-height:44px;padding:6px 12px;font:700 17px var(--display)}
.mine{color:var(--accent);font-weight:700;font-size:13px}
.nav-in button{font-size:12px}
/* verbs */
.pill{display:inline-block;font:800 14px/1 var(--display);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 10px;margin:0 8px 8px 0}
.vtable{border-collapse:collapse;width:100%;line-height:32px}
.vwrap{background:var(--card);margin:10px -22px -18px;padding:10px 22px 14px;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.vtable td{border-bottom:1px solid var(--line)}
.vtable tr:last-child td{border-bottom:0}
.vtable td{padding:4px 10px 4px 0;height:40px;vertical-align:middle}
.vtable .vp{color:var(--ink-2);font-size:15px;white-space:nowrap}
.vtable .vf{font:700 19px var(--display);width:100%}
.vtable .end{color:var(--margin)}
.vtable tr.hl .vf{color:var(--accent)}
.vtable tr.hl .vp{color:var(--ink);font-weight:700}
.vtable tr.off{opacity:.55}
.vtable .vs{width:36px;padding:0}
.speak.sm{width:32px;height:32px}
.speak.sm svg{width:16px;height:16px}
.vline{margin:0;font:700 18px/1.35 var(--display)}
.vline b{color:var(--accent)}
.row .vm{color:var(--ink-2);font-size:15px}
.irr{color:var(--hard);font-weight:700;font-size:13px}
.row .st.practising{color:var(--accent);font-weight:700}
/* home */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 6px}
.brand h1{font:800 42px/1 var(--display);letter-spacing:-.03em;color:var(--accent);margin:0;text-shadow:3px 3px 0 var(--lime);transform:rotate(-2deg);transform-origin:left bottom}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:15px;font-weight:700}
.streak{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm);font:800 20px var(--display);color:var(--ink-3);flex:none}
.streak svg{width:24px;height:24px}
.streak.on{color:var(--flame)}
.hero{display:flex;flex-direction:column;align-items:center;margin:14px 0 6px}
.bubble{position:relative;background:var(--bubble);border-radius:18px;padding:14px 18px;font:700 18px/1.35 var(--display);text-align:center;box-shadow:3px 3px 0 var(--ink);border:2.5px solid var(--ink);max-width:300px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--bubble);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble b{color:var(--accent)}
.bubble .b1,.bubble .b2{display:block}
.bubble .b2{font-size:17px;margin-top:2px}
.parrot{width:132px;height:auto;margin-top:10px;animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-2px)}}
.opt-label{font:800 14px var(--display);color:var(--ink-2);margin:18px 0 8px;letter-spacing:.02em}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:46px;border:0;border-radius:11px;background:none;font:800 17px var(--display);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--accent);box-shadow:var(--shadow-sm)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700;color:var(--ink-2);font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.ver{text-align:center;color:var(--ink-3);font-size:13px;margin:18px 0 0}
.done-head{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.done-head .parrot{width:72px;margin:0}
.done-head h1{font:800 32px/1.05 var(--display);color:var(--accent);margin:0;text-shadow:2px 2px 0 var(--lime)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:700;font-size:15px;z-index:60;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
body.focus #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.deck-seg button{font-size:16px;padding:0 4px}
.prompt.long{font-size:clamp(21px,6vw,27px);line-height:1.3;letter-spacing:0}
.index .body.free{background-image:none;line-height:1.35}
.answer.sent{display:block;line-height:1.3;letter-spacing:0;overflow-wrap:break-word;padding-top:10px}
.sent-row{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--ink-2);font-size:15px;font-weight:700}
.alts{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line);line-height:1.35}
.alts b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:6px}

<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'loro:v1';
const APP_VERSION = 9;
const BUCKETS = 16;
const MAX_APPEAR = 5;          // most times one card can show in a session
const IMPORT_SPREAD = 50;       // big studied imports spread this many per session
const SPREAD_OVER = 100;        // only spread imports bigger than this

/* ---------- state ---------- */
function freshState(){
  return { v:1, cards:{}, meta:{ session:1, ssession:0, lastActive:0, sessionReviews:0, updatedAt:0 },
           settings:{ size:30, vsize:30, ssize:10, mode:'recall', deck:'word' }, stats:freshStats() };
}
function freshStats(){ return { days:{}, total:{ ms:0, n:0, sess:0 } }; }
function normStats(x){
  const f = freshStats();
  if (!x || typeof x !== 'object') return f;
  return { days:(x.days && typeof x.days === 'object') ? x.days : {}, total:Object.assign(f.total, x.total || {}) };
}
function normalizeState(s){
  const f = freshState();
  if (!s || typeof s !== 'object') return f;
  return {
    v:1,
    cards: (s.cards && typeof s.cards === 'object') ? s.cards : {},
    meta: Object.assign(f.meta, s.meta || {}),
    settings: (st => { if (st.size === 10 || st.size === 20 || !(st.size >= 0)) st.size = 30; if (st.deck !== 'verb' && st.deck !== 'sentence') st.deck = 'word'; if (!(st.ssize >= 0)) st.ssize = 10; return st; })(Object.assign(f.settings, s.settings || {})),
    stats: normStats(s.stats)
  };
}
function loadLocal(){
  try { const raw = localStorage.getItem(KEY); return raw ? normalizeState(JSON.parse(raw)) : null; }
  catch(e){ return null; }
}
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
let state = loadLocal() || freshState();

let idCounter = 0;
function newId(){ return 'c' + Date.now().toString(36) + (idCounter++).toString(36) + Math.random().toString(36).slice(2,6); }
function bucketOf(id){ let h = 0; for (let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; } return h % BUCKETS; }

/* ---------- sync with Claude account (falls back to this device) ---------- */
const sync = { db:null, uid:null, status:'local', dirty:new Set(), metaDirty:false, timer:null, busy:false };
const SYNC_TEXT = {
  local:['Saved on this device','dot'], loading:['Loading your words…','dot busy'],
  saving:['Saving…','dot busy'], synced:['Saved to your Claude account','dot ok'],
  retry:['Couldn’t save just now. Trying again…','dot bad'],
  full:['Storage is full. Download a backup and remove some words.','dot bad']
};
function setSync(s){
  sync.status = s;
  const el = document.getElementById('sync-status');
  if (el){ const [t,c] = SYNC_TEXT[s]; el.innerHTML = `<span class="${c}"></span>${t}`; }
}
function touch(ids){
  state.meta.updatedAt = Date.now();
  saveLocal();
  if (!sync.db) return;
  if (ids === 'all'){ for (let i=0;i<BUCKETS;i++) sync.dirty.add(i); }
  else ids.forEach(id => sync.dirty.add(bucketOf(id)));
  sync.metaDirty = true;
  scheduleFlush();
}
function scheduleFlush(ms){ clearTimeout(sync.timer); sync.timer = setTimeout(flush, ms || 1200); if (sync.status !== 'retry') setSync('saving'); }
function bucketsCol(){ return sync.db.doc('data/users/' + sync.uid + '/deck').collection('buckets'); }
function metaRef(){ return sync.db.doc('data/users/' + sync.uid + '/meta'); }
function cardsInBucket(i){ const o = {}; for (const id in state.cards) if (bucketOf(id) === i) o[id] = state.cards[id]; return o; }
async function flush(){
  if (!sync.db) return;
  if (sync.busy){ scheduleFlush(800); return; }
  sync.busy = true;
  const buckets = [...sync.dirty]; sync.dirty.clear();
  const doMeta = sync.metaDirty; sync.metaDirty = false;
  let retry = false;
  try {
    for (const b of buckets) await bucketsCol().doc('b' + b).set({ cards: cardsInBucket(b) });
    if (doMeta) await metaRef().set({ meta: state.meta, settings: state.settings, stats: state.stats });
    setSync('synced');
  } catch(e){
    buckets.forEach(b => sync.dirty.add(b)); if (doMeta) sync.metaDirty = true;
    const code = e && e.code;
    if (['revoked','not_granted','capability_disabled','capability_removed','invalid_argument','transform_error'].includes(code)){ sync.db = null; setSync('local'); }
    else if (code === 'quota_exceeded'){ setSync('full'); }
    else { setSync('retry'); retry = true; }
  } finally { sync.busy = false; }
  if (retry) scheduleFlush(4000 + Math.random()*2000);
  else if (sync.db && (sync.dirty.size || sync.metaDirty)) scheduleFlush(800);
}
async function connectDb(){
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    sync.db = db; sync.uid = uid;
    setSync('loading');
    const timeout = new Promise((_, rej) => setTimeout(() => rej({ code:'timeout' }), 10000));
    const [mSnap, bSnap] = await Promise.race([Promise.all([metaRef().get(), bucketsCol().get()]), timeout]);
    const remoteCards = {}; let hasRemote = false;
    bSnap.docs.forEach(d => {
      if (!d.exists) return;
      const c = (d.data() || {}).cards || {};
      for (const k in c){ remoteCards[k] = JSON.parse(JSON.stringify(c[k])); hasRemote = true; }
    });
    const rm = mSnap.exists ? JSON.parse(JSON.stringify(mSnap.data() || {})) : null;
    if (rm) hasRemote = true;
    const remoteUpdated = (rm && rm.meta && rm.meta.updatedAt) || 0;
    if (hasRemote && !session && remoteUpdated >= (state.meta.updatedAt || 0)){
      state = normalizeState({ cards: remoteCards, meta: rm ? rm.meta : {}, settings: rm ? rm.settings : {}, stats: rm ? rm.stats : null });
      ensureVerbs(); saveLocal(); setSync('synced'); render();
    } else if (Object.keys(state.cards).length || state.meta.updatedAt){
      touch('all');
    } else setSync('synced');
  } catch(e){
    sync.db = null; setSync('local');
  }
}

/* ---------- helpers ---------- */
const app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
const allCards = () => Object.values(state.cards);
function dueList(){ const s = state.meta.session; return allCards().filter(c => c.status !== 'new' && c.due <= s).sort((a,b) => a.due - b.due || (b.lapses||0) - (a.lapses||0) || a.created - b.created); }
function newList(){ return allCards().filter(c => c.status === 'new').sort((a,b) => a.created - b.created); }
function aheadList(){ const s = state.meta.session; return allCards().filter(c => c.status !== 'new' && c.due > s).sort((a,b) => a.due - b.due || (b.lapses||0) - (a.lapses||0)); }
function dayKey(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function todayKey(){ return dayKey(new Date()); }
function yesterdayKey(){ const d = new Date(); return dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1)); }
function markPractised(){
  const m = state.meta, t = todayKey();
  if (m.lastDay === t) return;
  m.streak = m.lastDay === yesterdayKey() ? (m.streak || 0) + 1 : 1;
  m.lastDay = t;
  m.best = Math.max(m.best || 0, m.streak);
}
function streakNow(){ const m = state.meta; return (m.lastDay === todayKey() || m.lastDay === yesterdayKey()) ? (m.streak || 0) : 0; }

/* ---------- progress tracking ---------- */
const RIDX = { easy:0, medium:1, hard:2, wrong:3 };
const IDLE_CAP = 45000;   // the most one tap can add to your time, so a forgotten open card doesn't inflate it
function p2(n){ return n < 10 ? '0' + n : '' + n; }
function statKey(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function dayStat(k){
  const D = state.stats.days;
  return D[k] || (D[k] = { ms:0, n:0, r:[0,0,0,0], sess:0, nv:0, tp:[0,0,0,0,0,0,0,0] });
}
function periodOf(h){ return h >= 5 && h < 12 ? 0 : h >= 12 && h < 17 ? 1 : h >= 17 && h < 22 ? 2 : 3; }
function recordRating(c, r){
  const now = new Date(), k = statKey(now), d = dayStat(k), i = RIDX[r], pr = periodOf(now.getHours());
  d.r[i]++; d.n++; d.tp[pr * 2]++; if (i < 2) d.tp[pr * 2 + 1]++; if (c.type === 'verb') d.nv++;
  state.stats.total.n++;
  c.stat = c.stat || [0,0,0,0]; c.stat[i]++;
  return { k, i, pr, verb:c.type === 'verb' };
}
function unrecordRating(rec){
  const d = state.stats.days[rec.k]; if (!d) return;
  const dec = (a, i) => { a[i] = Math.max(0, (a[i] || 0) - 1); };
  dec(d.r, rec.i); dec(d.tp, rec.pr * 2); if (rec.i < 2) dec(d.tp, rec.pr * 2 + 1);
  d.n = Math.max(0, d.n - 1); if (rec.verb) d.nv = Math.max(0, (d.nv || 0) - 1);
  state.stats.total.n = Math.max(0, state.stats.total.n - 1);
}
let tickAt = 0;
function tick(){
  if (!tickAt) return;
  const now = Date.now(), live = view === 'review';
  const dt = live ? Math.min(now - tickAt, IDLE_CAP) : 0;
  tickAt = live ? now : 0;
  if (dt > 0){ dayStat(statKey(new Date())).ms += dt; state.stats.total.ms += dt; }
}
function pruneStats(){
  const cut = statKey(new Date(Date.now() - 400 * 864e5));
  for (const k in state.stats.days) if (k < cut) delete state.stats.days[k];
}

function makeCard(en, es, note, created, studied){
  return { id:newId(), en, es, note: note || '', created, status: studied ? 'seen' : 'new',
           gap:0, due: studied ? state.meta.session : 0, lapses:0, reviews:0 };
}

/* ---------- speech ---------- */
let esVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v => /^es[-_](MX|US|419)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(String(text).replace(/\([^)]*\)/g, '').split(/[\/;]/)[0].trim());
  u.lang = esVoice ? esVoice.lang : 'es-MX'; if (esVoice) u.voice = esVoice; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const SPEAK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- answer checking (typing mode) ---------- */
const ARTS = ['el','la','los','las','un','una','unos','unas'];
function norm(s){ return String(s).toLowerCase().replace(/[¿?¡!.,;:"“”'’()]/g,' ').replace(/\s+/g,' ').trim(); }
function fold(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function splitArt(s){ const p = s.split(' '); return (p.length > 1 && ARTS.includes(fold(p[0]))) ? { art:p[0], rest:p.slice(1).join(' ') } : { art:null, rest:s }; }
function lev(a,b){
  const m = a.length, n = b.length; if (Math.abs(m-n) > 1) return 2;
  let prev = Array.from({length:n+1}, (_,j) => j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++){ cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1)); } prev = cur; }
  return prev[n];
}
function checkAnswer(input, es, isVerb){
  let u = norm(input);
  if (isVerb) u = u.replace(/^(yo|tu|tú|el|él|ella|usted|nosotros|nosotras|ellos|ellas|ustedes)\s+/, '');
  if (!u) return { kind:'blank' };
  const rank = { exact:0, accent:1, article:2, typo:3, gender:4, wrong:5 };
  let best = { kind:'wrong' };
  for (const a of String(es).replace(/\([^)]*\)/g, '').split(/\s*[\/;]\s*/).map(norm).filter(Boolean)){
    let k = 'wrong';
    if (u === a) k = 'exact';
    else if (fold(u) === fold(a)) k = 'accent';
    else {
      const A = splitArt(a), U = splitArt(u);
      if (A.art && !U.art && fold(u) === fold(A.rest)) k = 'article';
      else if (A.art && U.art && fold(U.rest) === fold(A.rest) && fold(U.art) !== fold(A.art)) k = 'gender';
      else if (fold(a).length >= 4 && lev(fold(u), fold(a)) <= 1) k = 'typo';
    }
    if (rank[k] < rank[best.kind]) best = { kind:k };
  }
  return best;
}
const VERDICT = {
  exact:['Correct.','v-good'], accent:['Correct. Watch the accent.','v-good'],
  article:['Almost. Include the article.','v-close'], typo:['Almost. Check the spelling.','v-close'],
  gender:['Wrong article. Check el or la.','v-bad'], wrong:['Not quite.','v-bad'], blank:null
};
function markAccents(s){ return esc(s).replace(/[áéíóúüñÁÉÍÓÚÜÑ]/g, ch => '<mark>' + ch + '</mark>'); }

/* ---------- views ---------- */
let view = 'home';
let session = null;
let undoSnap = null;
let showCustom = false;
let includeAhead = false;
let wordQuery = '';
let imp = null;

function render(){
  document.body.classList.toggle('focus', view === 'review');
  document.querySelectorAll('[data-nav]').forEach(b => {
    const on = b.dataset.nav === view || (b.dataset.nav === 'words' && view === 'import') || (view === 'summary' && b.dataset.nav === ((session && session.back) || 'home'));
    if (on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  ({ home:renderHome, review:renderReview, summary:renderSummary, words:renderWords, verbs:renderVerbs, progress:renderProgress, import:renderImport, settings:renderSettings })[view]();
}

/* ---------- verbs ---------- */
// [infinitive, meaning, English base, English he/she form, present forms (yo, tú, él, nosotros, ellos), irregular?, hint]
const VERB_DATA = [
  ['ser','to be','','', 'soy,eres,es,somos,son',1,'ser: who or what someone is'],

  ['buscar','to look for','look for','looks for','busco,buscas,busca,buscamos,buscan',0,''],
  ['encontrar','to find','find','finds','encuentro,encuentras,encuentra,encontramos,encuentran',1,''],

  ['vender','to sell','sell','sells','vendo,vendes,vende,vendemos,venden',0,''],

const VERBS = VERB_DATA.map(([inf, m, b, s3, f, irr, h], i) => ({ inf, m, b, s3, f:f.split(','), irr:!!irr, h, rank:i }));
const VERB_MAP = Object.fromEntries(VERBS.map(v => [v.inf, v]));
const DEFAULT_VERBS = ['ser','estar','tener','ir','hacer','poder','querer','saber','comer','hablar'];
const EN_PRON = ['I','you','he / she','we','they'];
const PILL = ['yo','tú','él / ella / usted','nosotros','ellos / ellas / ustedes'];
const ES_PRON = ['yo','tú','él / ella / usted','nosotros','ellos / ustedes'];
const ENDINGS = { ar:['o','as','a','amos','an'], er:['o','es','e','emos','en'], ir:['o','es','e','imos','en'] };
const BE = ['am','are','is','are','are'];
function customVerbs(){ return state.meta.customVerbs || {}; }
function getVerb(inf){ return VERB_MAP[inf] || customVerbs()[inf] || null; }
function verbList(){ return VERBS.concat(Object.values(customVerbs())); }
function enPrompt(v, p){

let vimp = { text:'', on:true };
function parseVerbList(text){
  const rows = [], bad = [], seen = new Set(); let dupes = 0;
  for (const raw of String(text).replace(/\r/g, '').split('\n')){
    const line = raw.trim(); if (!line || line.startsWith('#')) continue;
    const parts = line.split(/\s*=\s*|\t+/).map(x => x.trim());
    const inf = (parts[0] || '').toLowerCase(), m = parts[1] || '';
    if (!/^[a-záéíóúüñ]{2,}$/.test(inf) || !enForms(m).b){ bad.push(line); continue; }
    let f = null, h = '';
    for (const x of parts.slice(2).filter(Boolean)){
      const fs = x.split(/\s*,\s*/).map(y => y.trim().toLowerCase()).filter(Boolean);
      if (!f && fs.length === 5) f = fs; else if (!h) h = x;
    }
    let auto = false;
    if (!f){ f = regularForms(inf); auto = !!f; }
    if (!f){ bad.push(line); continue; }
    if (getVerb(inf) || seen.has(inf)){ dupes++; continue; }
    seen.add(inf); rows.push({ inf, m, f, h, auto });
  }
  return { rows, bad, dupes };
}

// Weak = your last answer was Medium, Hard or Wrong (or a studied word you haven't rated yet).
function isWeak(c){
  if (c.status === 'new') return false;
  if (!c.lastRating) return !(c.gap > 0);
  return c.lastRating !== 'easy';
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const byDue = (a,b) => a.due - b.due;
const WEAK_RANK = { wrong:0, hard:1, medium:2 };
function pools(S, deck){
  const all = deckCards(deck);
  return {
    fresh: shuffle(all.filter(c => c.status === 'new')),
    weak: shuffle(all.filter(isWeak)).sort((a,b) => (WEAK_RANK[a.lastRating] ?? 2) - (WEAK_RANK[b.lastRating] ?? 2)),
    easyDue: shuffle(all.filter(c => c.status !== 'new' && !isWeak(c) && c.due <= S)).sort(byDue),
    later: shuffle(all.filter(c => c.status !== 'new' && !isWeak(c) && c.due > S)).sort(byDue)
  };
}
// Picks new words first, then weak words (Wrong, then Hard, then Medium), then Easy words
// whose break is over, then shuffles the picked cards so the order is random.
function plan(kind, S, deck){
  const size = sizeOf(deck) || Infinity;
  const p = pools(S, deck);
  if (kind === 'ahead') return shuffle(p.later.slice(0, Math.min(size, 20)).map(c => c.id));
  const order = [...p.fresh, ...p.weak, ...p.easyDue, ...(includeAhead ? p.later : [])];
  return shuffle(order.slice(0, size).map(c => c.id));
}

    ${isCustom ? `<div class="custom-size"><input id="custom-n" type="number" inputmode="numeric" min="1" max="999" value="${size > 0 && !sizes.some(([n]) => n === size) ? size : ''}" aria-label="Number of cards" placeholder="40"><span>cards</span></div>` : ''}
    ${p.later.length ? `<label class="toggle"><input type="checkbox" id="inc-ahead" ${includeAhead ? 'checked' : ''}>Add ${isV ? 'verb forms' : isS ? 'sentences' : 'words'} on an Easy break (${p.later.length})</label>` : ''}
    ${isS ? '<p class="help" style="margin-top:18px">Say the Spanish out loud or in your head, tap Show answer, then rate yourself.</p>' : `<div class="opt-label">Answer</div>
    <div class="seg" role="group" aria-label="Answer">
      <button data-act="mode" data-m="recall" aria-pressed="${s.mode === 'recall'}">In my head</button>
      <button data-act="mode" data-m="type" aria-pressed="${s.mode === 'type'}">Type it</button>
    </div>`}
    <button class="btn-primary" data-act="start">Start new session</button>
    ${ver}`;
}

function startSession(kind, deck){
  deck = deck || 'word';
  let q, S = 0;
  if (kind === 'struggle'){ q = shuffle(struggleList().slice(0, 20).map(c => c.id)); }
  else { S = nextS(deck); q = plan(kind, S, deck); }
  if (!q.length){ toast(kind === 'struggle' ? 'No tricky cards yet.' : 'Nothing to review right now.'); render(); return; }
  if (kind !== 'struggle') state.meta[sessKey(deck)] = S;
  state.meta.sessionReviews = 0;
  pruneStats();
  dayStat(statKey(new Date())).sess++; state.stats.total.sess++;
  touch([]);
  includeAhead = false;
  session = { queue:q, idx:0, appear:{}, missed:new Set(), stats:{easy:0,medium:0,hard:0,wrong:0},
              started:Date.now(), mode:deck === 'sentence' ? 'recall' : state.settings.mode, revealed:false, result:null, typed:'', deck,
              back: kind === 'struggle' ? 'progress' : 'home' };
  tickAt = Date.now();
  undoSnap = null; view = 'review'; render();
}

function renderReview(){
  const s = session;
  if (s.idx >= s.queue.length){ view = 'summary'; return render(); }
  const id = s.queue[s.idx], c = state.cards[id];
  if (!c){ s.queue.splice(s.idx,1); return renderReview(); }
  const left = s.queue.length - s.idx, pct = Math.round(s.idx / s.queue.length * 100);
  const isNew = c.status === 'new', again = (s.appear[id] || 0) > 0;
  const typing = s.mode === 'type' && !isNew && c.type !== 'sentence';
  const isVerb = c.type === 'verb', isSent = c.type === 'sentence';
  const tag = (isVerb ? `<span class="pill">${esc(c.pill)}</span>` : '')
    + (isNew ? `<span class="tag">${isVerb ? 'New verb form' : isSent ? 'New sentence' : 'New word'}. Have a guess, then look.</span>` : again ? '<span class="tag">Again</span>' : '');
  let body = '';
  if (s.revealed){
    const r = s.result, v = r && VERDICT[r.kind];
    body = `<p class="answer answer-in">${r && r.kind === 'accent' ? markAccents(c.es) : esc(c.es)}${'speechSynthesis' in window ? `<button class="speak" data-act="speak" aria-label="Hear it">${SPEAK_SVG}</button>` : ''}</p>
      ${v ? `<p class="verdict ${v[1]}">${v[0]}</p>` : ''}
      ${r && r.kind !== 'exact' && r.kind !== 'blank' ? `<p class="wrote">You wrote: ${esc(s.typed)}</p>` : ''}
      ${isVerb ? `<div class="vwrap">${verbTable(c.inf, c.p, true)}</div>` : ''}`;
  }
  if (s.revealed && isSent) body = sentenceAnswerHtml(c);
  const sugg = s.result ? ({ wrong:'wrong', gender:'wrong', blank:'wrong', typo:'hard', article:'hard' })[s.result.kind] : null;
  const easyGap = s.missed.has(id) ? 0 : (c.gap ? c.gap * 2 : 3);
  let controls;
  if (s.revealed){
    controls = `<div class="rates">
      <button class="rate easy${sugg==='easy'?' suggested':''}" data-act="rate" data-r="easy">Easy<small>${easyGap ? 'skip ' + easyGap : 'next session'}</small></button>
      <button class="rate medium" data-act="rate" data-r="medium">Medium<small>next time</small></button>
      <button class="rate hard${sugg==='hard'?' suggested':''}" data-act="rate" data-r="hard">Hard<small>again soon</small></button>
      <button class="rate wrong${sugg==='wrong'?' suggested':''}" data-act="rate" data-r="wrong">Wrong<small>2 more times</small></button>
    </div>`;
  } else if (typing){
    controls = `<input id="answer" class="answer-input" type="text" lang="es" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type the Spanish" aria-label="Your answer">
      <div class="keys">${['á','é','í','ó','ú','ñ','ü'].map(k => `<button class="key" data-key="${k}" aria-label="Insert ${k}">${k}</button>`).join('')}</div>
      <div class="type-row"><button class="btn" data-act="dunno">I don’t know</button><button class="btn-primary" data-act="check">Check</button></div>`;
  } else {
    controls = `<button class="btn-primary" data-act="reveal">${isNew && !isSent ? 'Show the Spanish' : 'Show answer'}</button>`;
  }
  app.innerHTML = `
    <div class="rv-top">
      <button class="icon-btn" data-act="end" aria-label="End session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
      <span class="left">${left} left</span>
      <button class="undo" data-act="undo" ${undoSnap ? '' : 'disabled'}>Undo</button>
    </div>
    <article class="index">
      <div class="head">${tag}<p class="prompt${isSent ? ' long' : ''}">${esc(c.en)}</p>${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}</div>
      <div class="body${isSent ? ' free' : ''}">${body}</div>
    </article>
    <div class="controls">${controls}</div>
    ${!s.revealed && !typing ? `<p class="hint">${isSent ? 'Say it in Spanish first, out loud or in your head.' : 'Say the Spanish word to yourself first.'}</p>` : ''}`;
  if (typing && !s.revealed){ const inp = document.getElementById('answer'); if (inp) inp.focus(); }
}

function sentenceAnswerHtml(c){
  const n = c.es.length, fs = n > 90 ? 21 : n > 60 ? 24 : n > 35 ? 27 : 31;
  const alts = Array.isArray(c.alts) ? c.alts : [];
  return `<p class="answer sent answer-in" style="font-size:${fs}px">${esc(c.es)}</p>
    ${'speechSynthesis' in window ? `<div class="sent-row"><button class="speak" data-act="speak" aria-label="Hear it">${SPEAK_SVG}</button>Hear it</div>` : ''}
    ${alts.length ? `<div class="alts"><b>Also fine:</b>${alts.map(a => `<p>${esc(a)}</p>`).join('')}</div>` : ''}`;
}
function reveal(){ tick(); session.revealed = true; render(); }
function doCheck(dunno){
  const inp = document.getElementById('answer');
  const typed = dunno ? '' : (inp ? inp.value : '');
  const c = state.cards[session.queue[session.idx]];
  tick();
  session.typed = typed;
  session.result = dunno ? { kind:'blank' } : checkAnswer(typed, c.es, c.type === 'verb');
  session.revealed = true; render();
}

function rate(r){
  const s = session, id = s.queue[s.idx], c = state.cards[id];
  if (!c) return;
  tick();
  undoSnap = { queue:s.queue.slice(), idx:s.idx, appear:Object.assign({}, s.appear), missed:new Set(s.missed),
               stats:Object.assign({}, s.stats), card:JSON.parse(JSON.stringify(c)), meta:Object.assign({}, state.meta) };
  const S = state.meta[sessKey(deckOf(c))] || 0;
  s.appear[id] = (s.appear[id] || 0) + 1;
  if (c.status === 'new') c.status = 'seen';
  c.reviews = (c.reviews || 0) + 1;
  s.stats[r]++;
  const removeFuture = () => { for (let i = s.queue.length - 1; i > s.idx; i--) if (s.queue[i] === id) s.queue.splice(i,1); };
  const hasFuture = () => s.queue.indexOf(id, s.idx + 1) !== -1;
  const canRepeat = s.appear[id] < MAX_APPEAR;
  if (r === 'easy'){
    if (s.missed.has(id)){ c.gap = 0; c.due = S + 1; }
    else { c.gap = c.gap ? Math.min(c.gap * 2, 512) : 3; c.due = S + c.gap + 1; }
  } else if (r === 'medium'){
    c.due = S + 1;
  } else if (r === 'hard'){
    c.gap = Math.floor((c.gap || 0) / 2); c.due = S + 1;
    if (canRepeat && !hasFuture()) s.queue.push(id);
  } else if (r === 'wrong'){
    c.gap = 0; c.due = S + 1; c.lapses = (c.lapses || 0) + 1; s.missed.add(id);
    removeFuture();
    if (canRepeat){
      s.queue.splice(Math.min(s.idx + 5, s.queue.length), 0, id);
      if (s.appear[id] + 1 < MAX_APPEAR) s.queue.push(id);
    }
  }
  c.lastRating = (s.missed.has(id) && r === 'easy') ? 'medium' : r;
  markPractised();
  undoSnap.rec = recordRating(c, r);
  c.last = Date.now();
  state.meta.sessionReviews++; state.meta.lastActive = Date.now();
  touch([id]);
  s.idx++; s.revealed = false; s.result = null; s.typed = '';
  render();
}
function undo(){
  if (!undoSnap || !session) return;
  const u = undoSnap, id = u.queue[u.idx];
  Object.assign(session, { queue:u.queue, idx:u.idx, appear:u.appear, missed:u.missed, stats:u.stats, revealed:true, result:null, typed:'' });
  state.cards[id] = u.card; state.meta = u.meta;
  if (u.rec) unrecordRating(u.rec);
  undoSnap = null; touch([id]); render();
}
function endSession(){
  tick(); tickAt = 0; touch([]);
  if (session && session.idx > 0) view = 'summary'; else { const b = session && session.back; session = null; view = b || 'home'; }
  render();
}

function renderSummary(){
  const s = session;
  if (!s){ view = 'home'; return render(); }
  const st = s.stats, total = st.easy + st.medium + st.hard + st.wrong;
  const mins = Math.max(1, Math.round((Date.now() - s.started) / 60000));
  const missed = [...s.missed].map(id => state.cards[id]).filter(Boolean);
  const seg = k => total ? `<span style="width:${st[k]/total*100}%;background:var(--${k})"></span>` : '';
  app.innerHTML = `
    <div class="done-head">${PARROT}<h1>${st.wrong === 0 && total ? '¡Perfecto!' : '¡Muy bien!'}</h1></div>
    <article class="index">
      <div class="head"><p class="prompt">${plural(total,'card')} in ${plural(mins,'minute')}</p></div>
      <div class="body">
        <div class="bar" aria-hidden="true">${seg('easy')}${seg('medium')}${seg('hard')}${seg('wrong')}</div>
        <div class="legend">
          <div><b style="color:var(--easy)">${st.easy}</b>Easy</div><div><b style="color:var(--medium)">${st.medium}</b>Medium</div>
          <div><b style="color:var(--hard)">${st.hard}</b>Hard</div><div><b style="color:var(--wrong)">${st.wrong}</b>Wrong</div>
        </div>
        ${missed.length ? `<p style="margin-top:14px;font-weight:700">Words you missed</p>
          <div class="missed${missed.some(c => c.type === 'sentence') ? ' one' : ''}">${missed.map(c => `<span>${esc(c.en)}</span><span class="es">${esc(c.es)}</span>`).join('')}</div>` : ''}
      </div>
    </article>
    <button class="btn-primary" data-act="done">${s.back === 'progress' ? 'Back to Progress' : 'Back to Study'}</button>`;
}

function statusOf(c){
  if (c.status === 'new') return ['New',''];
  if (isWeak(c)) return ['Practise','due'];
  const n = c.due - nextS();
  if (n <= 0) return ['Ready',''];
  return ['Easy break: ' + plural(n,'session'), ''];
}
function renderWords(){
  const n = deckCards().length;
  app.innerHTML = `
    <h1 class="title">Your words</h1>
    <p class="sub">${plural(n,'word')} in your deck</p>
    <div class="btn-row" style="margin-top:0"><button class="btn" data-act="add">Add a word</button><button class="btn" data-act="go-import">Import words</button><button class="btn" data-act="sent-paste">Import sentences</button></div>
    <input class="search" id="q" type="search" placeholder="Search English or Spanish" value="${esc(wordQuery)}" aria-label="Search words">
    <div class="list" id="wordlist"></div>`;
  renderWordList();
}
function renderWordList(){
  const el = document.getElementById('wordlist'); if (!el) return;
  const q = fold(norm(wordQuery));
  let list = deckCards().sort((a,b) => a.en.localeCompare(b.en));
  if (q) list = list.filter(c => fold(norm(c.en)).includes(q) || fold(norm(c.es)).includes(q));
  if (!list.length){ el.innerHTML = `<p class="empty">${deckCards().length ? 'No words match that search.' : 'No words yet. Add one or import your Anki deck.'}</p>`; return; }
  const LIMIT = 300;
  el.innerHTML = list.slice(0, LIMIT).map(c => { const [t,k] = statusOf(c); return `<button class="row" data-act="edit" data-id="${c.id}"><span class="en">${esc(c.en)}</span><span class="es">${esc(c.es)}</span><span class="st ${k}">${t}</span></button>`; }).join('')
    + (list.length > LIMIT ? `<p class="more">Showing ${LIMIT} of ${list.length}. Search to find the rest.</p>` : '');
}

function saveCard(id){
  const en = document.getElementById('f-en').value.trim();
  const es = document.getElementById('f-es').value.trim();

  if (!en || !es){ toast('Fill in both the English and the Spanish.'); return; }

  else {
    const dup = allCards().find(c => norm(c.en) === norm(en) && norm(c.es) === norm(es));
    if (dup){ toast('That word is already in your deck.'); return; }
    const c = makeCard(en, es, note, Date.now(), false); state.cards[c.id] = c; touch([c.id]);
    toast('Word added'); openEdit(null); render(); return;
  }
  render();
}

/* ---------- import ---------- */
function csvParse(text, sep){
  const rows = []; let row = [], f = '', q = false;
  for (let i=0;i<text.length;i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"' && f === '') q = true;
    else if (ch === sep){ row.push(f); f = ''; }
    else if (ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function cleanField(s){
  s = String(s || '').replace(/\[sound:[^\]]*\]/g, '');
  if (/[<&]/.test(s)){
    s = s.replace(/<br\s*\/?>/gi, ' ').replace(/<\/(div|p|li)>/gi, ' ');
    s = new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
  }
  return s.replace(/\s+/g, ' ').trim();
}
function looksSpanish(s){ return /[áéíóúñü¿¡]/i.test(s) || /^(el|la|los|las|un|una)\s/i.test(s) ? 1 : 0; }
function parseImport(text){
  text = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const lines = text.split('\n'); let i = 0, sep = null; const skip = new Set();
  for (; i < lines.length; i++){
    const l = lines[i]; if (!l.startsWith('#')) break;
    const m = l.match(/^#([a-z ]+):(.*)$/i); if (!m) continue;
    const k = m[1].trim().toLowerCase(), v = m[2].trim();
    if (k === 'separator') sep = ({ tab:'\t', comma:',', semicolon:';', space:' ', pipe:'|', colon:':' })[v.toLowerCase()] || v;
    else if (/column$/.test(k)){ const n = parseInt(v, 10); if (n) skip.add(n - 1); }
  }
  const body = lines.slice(i).join('\n');
  const sample = body.split('\n').filter(x => x.trim()).slice(0, 30);
  let rows;
  if (!sep){
    if (sample.some(l => l.includes('\t'))) sep = '\t';
    else if (sample.length && sample.every(l => /\s=\s|=/.test(l))) sep = '=';
    else if (sample.some(l => /\s[-–—]\s/.test(l))) sep = 'dash';
    else if (sample.some(l => l.includes(';'))) sep = ';';
    else sep = ',';
  }
  if (sep === '=' || sep === 'dash'){
    const re = sep === '=' ? /\s*=\s*/ : /\s+[-–—]\s+/;
    rows = body.split('\n').map(l => { const m = l.split(re); return m.length >= 2 ? [m[0], m.slice(1).join(' ')] : [l]; });
  } else rows = csvParse(body, sep);
  const out = [];
  for (const r of rows){
    const f = r.filter((_, idx) => !skip.has(idx)).map(cleanField);
    if (!f[0] || !f[1]) continue;
    const note = f[2] && f[2].length <= 120 ? f[2] : '';
    out.push({ a:f[0], b:f[1], note });
  }
  const scoreA = out.slice(0, 40).reduce((n, r) => n + looksSpanish(r.a), 0);
  const scoreB = out.slice(0, 40).reduce((n, r) => n + looksSpanish(r.b), 0);
  return { rows:out, swap: scoreA > scoreB };
}
function importPairs(){
  if (!imp || !imp.rows) return [];
  const have = new Set(allCards().map(c => norm(c.en) + '|' + norm(c.es)));
  const seen = new Set(); const out = [];
  for (const r of imp.rows){
    const en = imp.swap ? r.b : r.a, es = imp.swap ? r.a : r.b;
    const k = norm(en) + '|' + norm(es);
    if (have.has(k) || seen.has(k)) continue;
    seen.add(k); out.push({ en, es, note:r.note });
  }
  return out;
}
function renderImport(){
  if (!imp) imp = { text:'', rows:null, swap:false, studied:true };
  const pairs = importPairs();
  const dupes = imp.rows ? imp.rows.length - pairs.length : 0;
  app.innerHTML = `
    <h1 class="title">Import words</h1>
    <div class="panel">
      <h2>From AnkiDroid</h2>
      <p class="help">In AnkiDroid, open the menu, tap Export, and choose <b>Notes in plain text</b>. Save the file, then pick it here.</p>
      <div class="btn-row"><label class="btn" style="display:inline-flex;align-items:center;justify-content:center">Choose file<input id="imp-file" type="file" accept=".txt,.csv,.tsv,text/plain,text/csv" hidden></label></div>
    </div>
    <div class="panel">
      <h2>Or paste a list</h2>
      <p class="help">One word per line, English then Spanish, like <i>the table = la mesa</i>. Tabs and commas work too.</p>
      <label class="f" for="imp-text" style="position:absolute;left:-9999px">Words to import</label>
      <textarea class="field" id="imp-text" spellcheck="false" placeholder="the table = la mesa&#10;to eat = comer&#10;the car = el carro">${esc(imp.text)}</textarea>
      <div class="btn-row"><button class="btn" data-act="imp-read">Read the list</button></div>
    </div>
    ${imp.rows ? `<div class="panel">
      ${pairs.length ? `
        <h2>${plural(pairs.length,'word')} ready</h2>
        ${dupes ? `<p class="help">${plural(dupes,'line')} skipped because ${dupes === 1 ? 'it’s' : 'they’re'} already in your deck or repeated.</p>` : ''}
        <div class="scroll-x"><table class="preview"><thead><tr><th>English</th><th>Spanish</th></tr></thead>
          <tbody>${pairs.slice(0,8).map(p => `<tr><td>${esc(p.en)}</td><td>${esc(p.es)}</td></tr>`).join('')}</tbody></table></div>
        ${pairs.length > 8 ? `<p class="help">and ${pairs.length - 8} more</p>` : ''}
        <label class="check"><input type="checkbox" id="imp-swap" ${imp.swap ? 'checked' : ''}><span>Flip the columns<small>Use this if English and Spanish look swapped above.</small></span></label>
        <label class="check"><input type="checkbox" id="imp-studied" ${imp.studied ? 'checked' : ''}><span>I’ve studied these before<small>They go straight into reviews. Lists over ${SPREAD_OVER} words get spread across a few sessions. Leave this off to learn them as new words, which always come first in a session.</small></span></label>
        <button class="btn-primary" data-act="imp-go">Add ${plural(pairs.length,'word')}</button>`
      : `<h2>Nothing new to add</h2><p class="help">${imp.rows.length ? 'Every word in this list is already in your deck.' : 'I couldn’t find any English and Spanish pairs. Check that each line has both words.'}</p>`}
    </div>` : ''}
    <div class="btn-row"><button class="btn" data-act="go-words">Back to your words</button></div>`;
}
function runImport(){
  const pairs = importPairs(); if (!pairs.length) return;
  const base = Date.now(), studied = imp.studied;
  pairs.forEach((p, i) => {
    const c = makeCard(p.en, p.es, p.note, base + i, studied);
    if (studied && pairs.length > SPREAD_OVER) c.due = state.meta.session + Math.floor(i / IMPORT_SPREAD);
    state.cards[c.id] = c;
  });
  touch('all');
  toast(plural(pairs.length,'word') + ' added');
  imp = null; view = 'words'; render();
}

/* ---------- sentence import ---------- */
let simp = { text:'' };
function parseSentenceList(text){
  const rows = [], bad = [], seen = new Set(); let dupes = 0;
  const have = new Set(deckCards('sentence').map(c => norm(c.en)));
  for (const raw of String(text).replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n')){
    const line = raw.trim(); if (!line || line.startsWith('#')) continue;
    const parts = line.split(/\s*=\s*|\t+/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 2){ bad.push(line); continue; }
    const en = parts[0], es = parts[1], k = norm(en);
    if (have.has(k) || seen.has(k)){ dupes++; continue; }
    seen.add(k);
    rows.push({ en, es, alts:parts.slice(2).filter((a, i, arr) => a !== es && arr.indexOf(a) === i) });
  }
  return { rows, bad, dupes };
}

/* ---------- progress page ---------- */
let calOffset = 0;
function missCount(c){ return (c.stat ? c.stat[2] + c.stat[3] : 0); }
function seenCount(c){ return c.stat ? c.stat[0] + c.stat[1] + c.stat[2] + c.stat[3] : 0; }
// Cards you've marked Hard or Wrong, most-missed first.
function struggleList(){
  const on = verbsOn();
  return allCards().filter(c => missCount(c) > 0 && (c.type !== 'verb' || on[c.inf]))
    .sort((a, b) => missCount(b) - missCount(a) || (b.stat[3] - a.stat[3]));
}
function sumDays(fromAgo, toAgo){
  const out = { ms:0, n:0, r:[0,0,0,0], active:0 }, now = new Date();
  for (let i = toAgo; i <= fromAgo; i++){
    const d = state.stats.days[statKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i))];
    if (!d) continue;
    out.ms += d.ms || 0; out.n += d.n || 0; for (let k = 0; k < 4; k++) out.r[k] += d.r[k] || 0;
    if (d.ms > 0 || d.n > 0) out.active++;
  }
  return out;
}
function fmtDur(ms){
  const m = Math.round(ms / 60000);
  if (ms > 0 && m < 1) return '<1 min';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');
}
function mixOf(cards){
  let known = 0, practising = 0, fresh = 0;
  for (const c of cards){ if (c.status === 'new') fresh++; else if (isWeak(c)) practising++; else known++; }
  return { known, practising, fresh, total:cards.length };
}
function mixRow(label, x){
  const seg = (n, col) => x.total ? `<span style="width:${n / x.total * 100}%;background:${col}"></span>` : '';
  return `<div class="mixrow">
    <div class="mixhead"><b>${label}</b><span>${x.total}</span></div>
    <div class="bar" aria-hidden="true">${seg(x.known,'var(--easy)')}${seg(x.practising,'var(--hard)')}${seg(x.fresh,'var(--ink-3)')}</div>
    <div class="mixleg"><span><i style="background:var(--easy)"></i>${x.known} known</span><span><i style="background:var(--hard)"></i>${x.practising} practising</span><span><i style="background:var(--ink-3)"></i>${x.fresh} new</span></div>
  </div>`;
}
function calendarHtml(){
  const now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const y = base.getFullYear(), mo = base.getMonth(), blanks = base.getDay(), days = new Date(y, mo + 1, 0).getDate();
  const todayK = statKey(now);
  let cells = '';
  for (let i = 0; i < blanks; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++){
    const k = y + '-' + p2(mo + 1) + '-' + p2(d), st = state.stats.days[k];
    cells += `<span class="cal-d${st && st.n > 0 ? ' did' : ''}${k === todayK ? ' today' : ''}">${d}</span>`;
  }
  const chev = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  return `<div class="cal-head">
      <button class="icon-btn" data-act="cal" data-d="-1" aria-label="Previous month">${chev('M15 6l-6 6 6 6')}</button>
      <b>${base.toLocaleString('en-US', { month:'long', year:'numeric' })}</b>
      <button class="icon-btn" data-act="cal" data-d="1" aria-label="Next month" ${calOffset >= 0 ? 'disabled' : ''}>${chev('M9 6l6 6-6 6')}</button>
    </div>
    <div class="cal-grid">${['S','M','T','W','T','F','S'].map(w => `<span class="cal-w">${w}</span>`).join('')}${cells}</div>`;
}

const WEEK_LABELS = ['This week','Last week','2 weeks ago','3 weeks ago','4 weeks ago','5 weeks ago'];

async function backup(){
  const json = JSON.stringify({ app:'loro', v:1, exported:new Date().toISOString(), state }, null, 1);
  const name = 'loro-backup-' + new Date().toISOString().slice(0,10) + '.json';
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({ filename:name, data:new Blob([json], { type:'application/json' }) }); toast('Backup saved'); return; }
  } catch(e){
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited'){ toast('Try again in a moment.'); return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup saved to your Downloads'); return;
  } catch(e){}
  try { await navigator.clipboard.writeText(json); toast('Backup copied. Paste it into a note to keep it safe.'); }
  catch(e){ toast('Couldn’t save the backup on this device.'); }
}
function restore(text){

  const st = obj && obj.state; if (!st || !st.cards){ toast('That file isn’t a Loro backup.'); return; }
  const n = Object.keys(st.cards).length;
  openSheet(`<h2>Replace your deck?</h2><p class="help">This swaps your current ${plural(allCards().length,'card')} (words, verbs and sentences) for the ${plural(n,'card')} in the backup, with their progress.</p>

    <div class="btn-row"><button class="btn" data-act="close-sheet">Cancel</button></div>`);
  pendingRestore = st;
}

  if (inInput){ if (e.key === 'Enter'){ e.preventDefault(); doCheck(false); } return; }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (!session.revealed && session.mode === 'recall' && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); reveal(); return; }
  if (!session.revealed && state.cards[session.queue[session.idx]] && state.cards[session.queue[session.idx]].status === 'new' && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); reveal(); return; }
  if (session.revealed){ const r = { '1':'easy','2':'medium','3':'hard','4':'wrong' }[e.key]; if (r){ e.preventDefault(); rate(r); } }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ tick(); tickAt = 0; saveLocal(); }
  else if (view === 'review'){ tickAt = Date.now(); }
  else if (view === 'home'){ render(); }
});
window.addEventListener('pagehide', () => { tick(); saveLocal(); });

ensureVerbs();
render();
connectDb();
if (!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
